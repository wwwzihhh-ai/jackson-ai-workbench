name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh Chinese finance news
        id: news
        shell: bash
        run: |
          if node scripts/fetch-news.mjs; then
            echo "News feed refreshed from GDELT."
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled news refresh failed; keeping the last successful Pages deployment."
            exit 1
          else
            echo "Push build could not refresh GDELT; trying to retain the currently published feed."
            if curl --fail --silent --show-error --location --max-time 20 \
              "https://wwwzihhh-ai.github.io/jackson-ai-workbench/news.json" \
              --output /tmp/jackson-previous-news.json; then
              if node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/jackson-previous-news.json','utf8'));if(!Array.isArray(p.items))process.exit(1)"; then
                mv /tmp/jackson-previous-news.json public/news.json
                echo "Previous published news feed retained."
              else
                echo "Published feed was invalid; the checked-in demo fallback will be used."
              fi
            else
              echo "No previous feed is available; the clearly labelled demo fallback will be used."
            fi
          fi
      - name: Build
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
